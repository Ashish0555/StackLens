[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stacklens"
version = "0.2.0"
description = "StackLens: an engineering knowledge assistant with evidence-checked answers and queued ingestion."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "langchain>=1.3,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langchain-postgres>=0.0.17,<1",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.2,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    # The primitive behind slowapi and flask-limiter. Used directly because
    # slowapi cannot find routes registered through include_router.
    "limits>=3.0,<6",
    "openai>=3.6,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.2,<2",
    "pypdf>=6.16,<7",
    "typer>=0.27,<1",
    "rich>=15.0,<16",
    "langfuse>=4.15,<6",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "redis>=5.2,<9",
    "python-multipart>=0.0.20",
    "confluent-kafka>=2.6,<3",
]

[project.optional-dependencies]
safety = ["llm-guard>=0.3.16,<1", "sentence-transformers>=3.0,<7"]
rerank = ["sentence-transformers>=3.0,<7"]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
stacklens = "stacklens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Keep local tests deterministic and lightweight.
addopts = "-q --strict-markers -n 0"
markers = [
    "integration: requires a running PostgreSQL service",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.12"
packages = ["stacklens"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.setuptools.package-data]
stacklens = ["web/*.html", "web/*.css", "web/*.js"]
