name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest tests/unit --cov=stacklens
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stacklens
          POSTGRES_PASSWORD: stacklens
          POSTGRES_DB: stacklens
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stacklens -d stacklens"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: pytest tests/integration -n 0
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
        env: {OPENAI_API_KEY: build-only-placeholder}
      - run: docker compose -f docker-compose.yml -f docker-compose.kafka.yml config --quiet
        env: {OPENAI_API_KEY: build-only-placeholder}
      - run: docker build -t stacklens:ci .
      - run: docker run --rm stacklens:ci --help
